# GPIO Pin Definitions
substitutions:
  door_relay_pin: "GPIO16"
  buzzer_relay_pin: "GPIO17"
  door_open_sensor_pin: "GPIO4"
  door_closed_sensor_pin: "GPIO5"
  status_led_pin: "GPIO23"
  auto_close_timer_minutes: "10"      # Default for the HA slider (first boot only)
  auto_close_enabled_value: "true"    # Default for auto-close (first boot only)

esphome:
  name: garagedoorcontroller
  friendly_name: GarageDoorController
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: door_open_sensor
              - lambda: 'return id(auto_close_enabled);'
          then:
            - script.execute: start_auto_close_timer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key1

ota:
  - platform: esphome
    password: !secret ota_pass1

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  - ssid: !secret 2_wifi_ssid
    password: !secret 2_wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret wifi_local_ssid
    password: !secret wifi_local_password

captive_portal:

web_server:
  port: 80

# Auto-close state
globals:
  - id: auto_close_enabled
    type: bool
    restore_value: true
    initial_value: $auto_close_enabled_value
  - id: countdown_seconds
    type: int
    restore_value: false
    initial_value: '0'

# Auto-close timeout, adjustable from Home Assistant
number:
  - platform: template
    name: "Garage Door Auto-Close Minutes"
    id: auto_close_minutes
    icon: "mdi:timer-cog-outline"
    optimistic: true
    restore_value: true
    initial_value: ${auto_close_timer_minutes}
    min_value: 1
    max_value: 30
    step: 1
    mode: slider
    unit_of_measurement: "min"
    entity_category: config

binary_sensor:
  # Reed switch for door open position
  - platform: gpio
    pin:
      number: $door_open_sensor_pin
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Garage Door Open Sensor"
    id: door_open_sensor
    device_class: garage_door
    filters:
      - delayed_on_off: 100ms
    on_release:
      # Door left the fully-open position - stop auto-close timer
      - script.execute: stop_auto_close_timer
      - cover.template.publish:
          id: garage_door_cover
          current_operation: CLOSING
    on_press:
      - cover.template.publish:
          id: garage_door_cover
          state: OPEN
          current_operation: IDLE
      # Door opened - start auto-close timer if enabled
      - if:
          condition:
            lambda: 'return id(auto_close_enabled);'
          then:
            - script.execute: start_auto_close_timer

  # Reed switch for door closed position
  - platform: gpio
    pin:
      number: $door_closed_sensor_pin
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Garage Door Closed Sensor"
    id: door_closed_sensor
    device_class: garage_door
    filters:
      - delayed_on_off: 100ms
    on_press:
      - cover.template.publish:
          id: garage_door_cover
          state: CLOSED
          current_operation: IDLE
    on_release:
      - cover.template.publish:
          id: garage_door_cover
          current_operation: OPENING

switch:
  # Main garage door relay (momentary)
  - platform: gpio
    pin: $door_relay_pin
    name: "Garage Door Relay"
    id: garage_door_relay
    icon: "mdi:garage"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: garage_door_relay

  # Buzzer relay (momentary - short pulse so back-to-back beeps don't collide)
  - platform: gpio
    pin: $buzzer_relay_pin
    name: "Garage Door Buzzer"
    id: garage_door_buzzer
    icon: "mdi:bell-ring"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 300ms
      - switch.turn_off: garage_door_buzzer

  # Auto-close enable/disable switch
  - platform: template
    name: "Garage Door Auto-Close"
    id: auto_close_switch
    icon: "mdi:timer-outline"
    lambda: |-
      return id(auto_close_enabled);
    turn_on_action:
      - globals.set:
          id: auto_close_enabled
          value: 'true'
      - if:
          condition:
            binary_sensor.is_on: door_open_sensor
          then:
            - script.execute: start_auto_close_timer
    turn_off_action:
      # FIX: was $auto_close_enabled_value ("true"), which re-enabled auto-close
      - globals.set:
          id: auto_close_enabled
          value: 'false'
      - script.execute: stop_auto_close_timer

# Template cover for garage door
cover:
  - platform: template
    name: "Garage Door"
    id: garage_door_cover
    device_class: garage
    on_open:
      - logger.log: "Cover is Open!"
    on_closed:
      - logger.log: "Cover is Closed!"

    # Manual open from HA: 5 warning beeps, then pulse the relay
    open_action:
      - if:
          condition:
            binary_sensor.is_off: door_open_sensor
          then:
            - repeat:
                count: 5
                then:
                  - switch.turn_on: garage_door_buzzer
                  - delay: 600ms
            - switch.turn_on: garage_door_relay

    # Manual close from HA: 7 beeps, pause, 3 beeps, then pulse the relay
    close_action:
      - if:
          condition:
            binary_sensor.is_off: door_closed_sensor
          then:
            # Cancel any pending auto-close so it can't fire mid-manual-close
            - script.execute: stop_auto_close_timer
            - repeat:
                count: 7
                then:
                  - switch.turn_on: garage_door_buzzer
                  - delay: 600ms
            - delay: 1500ms
            - repeat:
                count: 3
                then:
                  - switch.turn_on: garage_door_buzzer
                  - delay: 600ms
            - switch.turn_on: garage_door_relay

    stop_action:
      - switch.turn_on: garage_door_relay

    # Determine current state based on reed switches.
    # FIX: must return a position; return {} (no change) when mid-travel
    # instead of COVER_OPERATION_OPENING (which equals 1.0 == COVER_OPEN).
    lambda: |-
      if (id(door_open_sensor).state) return COVER_OPEN;
      if (id(door_closed_sensor).state) return COVER_CLOSED;
      return {};

    # Optimistic mode disabled since we have position feedback
    optimistic: false

# Auto-close timer scripts
script:
  - id: start_auto_close_timer
    then:
      - if:
          condition:
            lambda: 'return id(auto_close_enabled);'
          then:
            # Stop any existing timer first, then restart
            - script.stop: auto_close_countdown
            - script.stop: countdown_updater
            - script.execute: auto_close_countdown
            - script.execute: countdown_updater

  # Owns the whole auto-close sequence (wait, warning, relay) so that
  # script.stop cancels it at ANY point, including during the beeps.
  - id: auto_close_countdown
    then:
      - globals.set:
          id: countdown_seconds
          value: !lambda 'return (int) id(auto_close_minutes).state * 60;'
      - delay: !lambda 'return (uint32_t) id(auto_close_minutes).state * 60 * 1000;'
      - if:
          condition:
            and:
              - binary_sensor.is_on: door_open_sensor
              - lambda: 'return id(auto_close_enabled);'
          then:
            - logger.log: "Auto-close: warning"
            - repeat:
                count: 7
                then:
                  - switch.turn_on: garage_door_buzzer
                  - delay: 600ms
            - delay: 1500ms
            - repeat:
                count: 3
                then:
                  - switch.turn_on: garage_door_buzzer
                  - delay: 600ms
            # Last chance to abort - re-check right before firing the relay
            - if:
                condition:
                  and:
                    - binary_sensor.is_on: door_open_sensor
                    - lambda: 'return id(auto_close_enabled);'
                then:
                  - logger.log: "Auto-close: closing door"
                  - switch.turn_on: garage_door_relay
      # Clear countdown when done
      - globals.set:
          id: countdown_seconds
          value: '0'

  - id: countdown_updater
    then:
      - while:
          condition:
            lambda: 'return id(countdown_seconds) > 0;'
          then:
            - delay: 1s
            - globals.set:
                id: countdown_seconds
                value: !lambda 'return id(countdown_seconds) - 1;'

  - id: stop_auto_close_timer
    then:
      - script.stop: auto_close_countdown
      - script.stop: countdown_updater
      - globals.set:
          id: countdown_seconds
          value: '0'

# Status LED (optional)
status_led:
  pin: $status_led_pin

text_sensor:
  # Formatted countdown display (minutes:seconds)
  - platform: template
    name: "Garage Door Countdown Display"
    id: countdown_display
    icon: "mdi:clock-outline"
    lambda: |-
      int total_seconds = id(countdown_seconds);
      if (total_seconds <= 0) {
        return {"--:--"};
      }
      char buffer[12];
      snprintf(buffer, sizeof(buffer), "%d:%02d", total_seconds / 60, total_seconds % 60);
      return {buffer};
    update_interval: 1s

# Sensors for diagnostics and countdown
sensor:
  - platform: wifi_signal
    name: "Garage Door WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Garage Door Uptime"

  # Auto-close countdown timer
  - platform: template
    name: "Garage Door Auto-Close Countdown"
    id: auto_close_countdown_sensor
    icon: "mdi:timer-outline"
    unit_of_measurement: "s"
    lambda: 'return id(countdown_seconds);'
    update_interval: 1s
    filters:
      - lambda: |-
          if (x <= 0) {
            return {};  // Return empty when countdown is 0 or negative
          }
          return x;
